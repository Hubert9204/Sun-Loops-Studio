# Builds Sun Loops Studio on Fedora (the base of Nobara) and on macOS (0.63.0) and runs the headless tests on every push and pull
# request. The macOS job also packs the .dmg, kept as an artifact of the run.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install the build dependencies (the same list as scripts/setup_nobara.sh)
        run: |
          dnf install -y gcc-c++ cmake ninja-build git pkgconf-pkg-config alsa-lib-devel \
            pipewire-jack-audio-connection-kit-devel freetype-devel fontconfig-devel libX11-devel libXext-devel \
            libXinerama-devel libXrandr-devel libXcursor-devel libXrender-devel libXcomposite-devel mesa-libGL-devel \
            libcurl-devel ladspa-devel
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (warnings are reported in the log)
        run: cmake --build build
      - name: Run the tests
        run: ./build/SunLoopsStudioTests_artefacts/Release/SunLoopsStudioTests

  macos:
    runs-on: macos-latest # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: brew install ninja
      - name: "Configure (Apple silicon only; the universal build is made for releases)"
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build (warnings are reported in the log; every error is shown, not only the first)
        run: cmake --build build -- -k 0
      - name: Run the tests
        run: ./build/SunLoopsStudioTests_artefacts/Release/SunLoopsStudioTests
      - name: Pack the app (universal .dmg)
        if: always()
        run: BUILD_DIR="$PWD/build-dmg" scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun-loops-studio-macos
          path: dist/*.dmg
          if-no-files-found: ignore
