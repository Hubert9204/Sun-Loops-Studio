# Builds Sun Loops Studio on Fedora (the base of Nobara) and runs the headless tests on every push and pull request.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install the build dependencies (the same list as scripts/setup_nobara.sh)
        run: |
          dnf install -y gcc-c++ cmake ninja-build git pkgconf-pkg-config alsa-lib-devel \
            pipewire-jack-audio-connection-kit-devel freetype-devel fontconfig-devel libX11-devel libXext-devel \
            libXinerama-devel libXrandr-devel libXcursor-devel libXrender-devel libXcomposite-devel mesa-libGL-devel \
            libcurl-devel
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (warnings are reported in the log)
        run: cmake --build build
      - name: Run the tests
        run: ./build/SunLoopsStudioTests_artefacts/Release/SunLoopsStudioTests
