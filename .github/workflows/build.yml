# Builds Sun Loops Studio on Fedora (the base of Nobara), on macOS (0.63.0) and on Windows (0.75.0) and runs the headless tests on
# every push and pull request. The macOS job also packs the .dmg and the Windows job the installer and the zip, kept as artifacts
# of the run.
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - name: Install the build dependencies (the same list as scripts/setup_nobara.sh)
        run: |
          dnf install -y gcc-c++ cmake ninja-build git pkgconf-pkg-config alsa-lib-devel \
            pipewire-jack-audio-connection-kit-devel freetype-devel fontconfig-devel libX11-devel libXext-devel \
            libXinerama-devel libXrandr-devel libXcursor-devel libXrender-devel libXcomposite-devel mesa-libGL-devel \
            libcurl-devel ladspa-devel
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build (warnings are reported in the log)
        run: cmake --build build
      - name: Run the tests
        run: ./build/SunLoopsStudioTests_artefacts/Release/SunLoopsStudioTests

  macos:
    runs-on: macos-latest # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install the build tools
        run: brew install ninja
      - name: "Configure (Apple silicon only; the universal build is made for releases)"
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Build (warnings are reported in the log; every error is shown, not only the first)
        run: cmake --build build -- -k 0
      - name: Run the tests
        run: ./build/SunLoopsStudioTests_artefacts/Release/SunLoopsStudioTests
      # The Intel half on its own, under Rosetta: its code is the one built for macOS 10.15 (the Apple silicon half starts at 11).
      - name: Build and run the tests on Intel (x86_64 under Rosetta)
        if: always()
        run: |
          cmake -S . -B build-intel -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-intel --target SunLoopsStudioTests -- -k 0
          SLS_TIMING_SCALE=3 arch -x86_64 ./build-intel/SunLoopsStudioTests_artefacts/Release/SunLoopsStudioTests
      - name: Pack the app (universal .dmg)
        if: always()
        run: BUILD_DIR="$PWD/build-dmg" scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun-loops-studio-macos
          path: dist/*.dmg
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The x64 build environment of Visual Studio 2022 (its Clang, clang-cl, builds; CMake and Ninja come with it).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure (clang-cl, as the releases)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
      - name: Build (warnings are reported in the log; every error is shown, not only the first)
        run: cmake --build build -- -k 0
      # 0.76.0: a real ASIO driver for the tests to find and load - FlexASIO (free, MIT), its installer pinned by SHA-256.
      - name: Install an ASIO driver (FlexASIO)
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\FlexASIO-1.10b.exe"
          Invoke-WebRequest https://github.com/dechamps/FlexASIO/releases/download/flexasio-1.10b/FlexASIO-1.10b.exe -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne "FE496BCC08D6C421C6244C8A60AC7B538560BDA138000FD1A54AB8EBCE031209") { throw "FlexASIO: wrong checksum" }
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Get-ChildItem "HKLM:\SOFTWARE\ASIO" | ForEach-Object { "ASIO driver registered: " + $_.PSChildName }
      - name: Run the tests
        env:
          SLS_EXPECT_ASIO_DRIVER: FlexASIO
        run: .\build\SunLoopsStudioTests_artefacts\Release\SunLoopsStudioTests.exe
      - name: Show the tests' crash report, if they crashed
        if: failure()
        shell: bash
        run: cat "$TEMP/sls-tests-crash/crash_last_session.log" || echo "no crash report"
      - name: Install Inno Setup (for the installer)
        if: always()
        run: choco install innosetup --no-progress -y
      - name: Pack the installer and the zip
        if: always()
        shell: pwsh
        run: scripts\build_windows.ps1 -BuildDir build
      # The zip as a user would use it: unpacked somewhere else and started from there for 40 seconds. It must still be running,
      # its session log must say it started, it must have registered the .slp files for this user and left no crash report; the
      # screen (the program's window brought to the front) goes into the log, between SCREENSHOT-BEGIN and SCREENSHOT-END.
      - name: Try the zip (start the program unpacked)
        shell: pwsh
        run: |
          $zip = Get-Item dist\Sun-Loops-Studio-*-Windows-x64.zip
          Expand-Archive $zip.FullName -DestinationPath "$env:RUNNER_TEMP\unpacked" -Force
          $folder = "$env:RUNNER_TEMP\unpacked\Sun Loops Studio"
          Get-ChildItem -Recurse $folder -File | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName.Substring($folder.Length + 1) }
          $p = Start-Process -FilePath "$folder\Sun Loops Studio.exe" -PassThru
          Start-Sleep -Seconds 40
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Win -Name User32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr h, int c); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr h);'
          $p.Refresh()
          if ($p.MainWindowHandle -ne 0) { [Win.User32]::ShowWindow($p.MainWindowHandle, 3) | Out-Null; [Win.User32]::SetForegroundWindow($p.MainWindowHandle) | Out-Null; Start-Sleep -Seconds 3 }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $stream = New-Object System.IO.MemoryStream
          $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Png)
          "SCREENSHOT-BEGIN"; [Convert]::ToBase64String($stream.ToArray()); "SCREENSHOT-END"
          $state = "$env:LOCALAPPDATA\SunLoopsStudio"
          Get-Content "$state\logs\session.log" -Tail 40
          $command = (Get-ItemProperty "HKCU:\Software\Classes\SunLoopsStudio.Project\shell\open\command" -ErrorAction SilentlyContinue).'(default)'
          "File type: $command"
          if ($p.HasExited) { throw "the program ended by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (Test-Path "$state\crash_last_session.log") { Get-Content "$state\crash_last_session.log"; throw "a crash report was written" }
          if ($command -ne "`"$folder\Sun Loops Studio.exe`" `"%1`"") { throw ".slp files were not registered for the unpacked program" }
      # The installer, silently for this user: the files in %LOCALAPPDATA%\Programs, the .slp files opening the installed program,
      # the program starting from there; then the uninstaller, which must take all of it away again.
      - name: Try the installer (install, start, uninstall)
        shell: pwsh
        run: |
          $setup = Get-Item dist\Sun-Loops-Studio-*-Windows-x64-Setup.exe
          Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Sun Loops Studio"
          Get-ChildItem $app -Name
          foreach ($f in "Sun Loops Studio.exe", "Sun Loops Studio.pdb", "sun-loops-helios.exe", "VST3\SunBurst.vst3", "VST3\SunRiff.vst3", "unins000.exe") {
            if (-not (Test-Path "$app\$f")) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 30; throw "not installed: $f" }
          }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\SunLoopsStudio.Project\shell\open\command").'(default)'
          "File type: $command"
          if ($command -ne "`"$app\Sun Loops Studio.exe`" `"%1`"") { throw ".slp files do not open the installed program" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Sun Loops Studio.lnk")) { throw "no Start menu entry" }
          $p = Start-Process -FilePath "$app\Sun Loops Studio.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the installed program ended by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          # (the uninstaller goes on from a copy of itself: wait for it)
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\Sun Loops Studio.exe"); $i++) { Start-Sleep -Seconds 1 }
          Start-Sleep -Seconds 2
          if (Test-Path "$app\Sun Loops Studio.exe") { throw "the uninstaller left the program behind" }
          if (Test-Path "HKCU:\Software\Classes\SunLoopsStudio.Project") { throw "the uninstaller left the .slp file type behind" }
          "Installed, started and uninstalled."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun-loops-studio-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: ignore
