# Publishes a release - when a version tag (v0.51.0) is pushed, or with "Run workflow" on GitHub (Actions > Release), which
# releases the version written in CMakeLists.txt of the chosen branch and creates its tag. It builds the AppImage on
# Ubuntu 24.04 (glibc 2.39, the same base as the AppImages tested so far on Nobara) and attaches it, with its checksum and
# the CHANGELOG section, to a GitHub release. The program's update check reads /releases/latest and offers that AppImage (0.51.0).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Leave empty to release the version in CMakeLists.txt; or an existing tag to publish again, such as v0.51.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build git \
            curl ca-certificates file python3 desktop-file-utils gh libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxrender-dev \
            libxcomposite-dev libgl1-mesa-dev libcurl4-openssl-dev ladspa-sdk
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - name: Check that the tag matches the version in CMakeLists.txt
        run: |
          version="$(sed -n 's/^project(SunLoopsStudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$TAG" ] || TAG="v$version" # "Run workflow" without a tag: this version, tagged on this commit
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "COMMIT=$(git -c safe.directory='*' rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build the AppImage
        run: scripts/build_appimage.sh
      - name: Write the checksum and the notes
        run: |
          cd dist
          sha256sum "Sun-Loops-Studio-$VERSION-x86_64.AppImage" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python3 scripts/release_notes.py "$VERSION" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files="dist/Sun-Loops-Studio-$VERSION-x86_64.AppImage dist/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --target "$COMMIT" --title "Sun Loops Studio $VERSION" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
