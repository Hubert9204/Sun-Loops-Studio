# Publishes a release - when a version tag (v0.51.0) is pushed, or with "Run workflow" on GitHub (Actions > Release), which
# releases the version written in CMakeLists.txt of the chosen branch and creates its tag. It builds the AppImage on Fedora 41
# (glibc 2.40) and attaches it, with its checksum and the CHANGELOG section, to a GitHub release; since 0.63.0 a second job adds
# the universal macOS disk image (Sun-Loops-Studio-<version>-macOS.dmg) to the same release. The program's update check
# reads /releases/latest and offers that AppImage (0.51.0).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Leave empty to release the version in CMakeLists.txt; or an existing tag to publish again, such as v0.51.0'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  appimage:
    # In the same Fedora container as the "Build and test" workflow: GitHub's Ubuntu machines could not reach the Ubuntu
    # archive (name lookups failed on two runs). The AppImage needs glibc 2.40 (Fedora 41 / Nobara 41 and newer).
    runs-on: ubuntu-latest
    container: fedora:41
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
      APPIMAGE_EXTRACT_AND_RUN: 1 # linuxdeploy and appimagetool run without FUSE
    steps:
      - name: Install the build dependencies (the list of scripts/setup_nobara.sh, plus the release tools)
        run: |
          dnf install -y gcc-c++ cmake ninja-build git pkgconf-pkg-config alsa-lib-devel \
            pipewire-jack-audio-connection-kit-devel freetype-devel fontconfig-devel libX11-devel libXext-devel \
            libXinerama-devel libXrandr-devel libXcursor-devel libXrender-devel libXcomposite-devel mesa-libGL-devel \
            libcurl-devel ladspa-devel desktop-file-utils python3 gh curl file findutils
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - name: Check that the tag matches the version in CMakeLists.txt
        run: |
          version="$(sed -n 's/^project(SunLoopsStudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$TAG" ] || TAG="v$version" # "Run workflow" without a tag: this version, tagged on this commit
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build the AppImage
        run: scripts/build_appimage.sh
      - name: Write the checksum and the notes
        run: |
          cd dist
          sha256sum "Sun-Loops-Studio-$VERSION-x86_64.AppImage" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          python3 scripts/release_notes.py "$VERSION" > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="dist/Sun-Loops-Studio-$VERSION-x86_64.AppImage dist/SHA256SUMS.txt"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --target "$COMMIT" --title "Sun Loops Studio $VERSION" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi

  macos:
    # After the AppImage job, which creates the release: this one adds the .dmg and its checksum to it.
    needs: appimage
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - name: Read the version
        run: |
          version="$(sed -n 's/^project(SunLoopsStudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$TAG" ] || TAG="v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Install the build tools
        run: brew install ninja
      - name: Build the universal .dmg
        run: scripts/build_macos.sh
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          shasum -a 256 "Sun-Loops-Studio-$VERSION-macOS.dmg" > SHA256SUMS-macOS.txt
          cat SHA256SUMS-macOS.txt
          gh release upload "$TAG" "Sun-Loops-Studio-$VERSION-macOS.dmg" SHA256SUMS-macOS.txt --clobber --repo "$GITHUB_REPOSITORY"
